<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>wxrperz</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- Football Cursor -->
    <style>
        html,
        body,
        * {
            cursor: url("football.png") 16 16, auto !important;
        }
    </style>

</head>

<body>

    <!-- Click To Enter -->
    <div id="enter-screen">

        <div class="enter-content">

            <h2>wxrperz</h2>

            <p>click to enter</p>

        </div>

    </div>


    <!-- Background -->
    <div class="background"></div>


    <!-- Main profile card -->
    <main class="profile">

        <!-- Profile picture -->
        <div class="avatar">
            <img src="pfp.jpg" alt="wxrperz">
        </div>


        <!-- Username -->
        <h1>wxrperz</h1>


        <!-- Bio -->
        <p class="bio">
            follow up!
        </p>


        <!-- Location -->
        <p class="location">
            <i class="fa-solid fa-location-dot"></i>
            in your heart
        </p>


        <!-- Small profile box -->
        <div class="user-box">

            <img src="profile.jpg" alt="wxrperz">

            <div class="user-info">

                <strong>amanmessi</strong>

                <p>💖</p>

                <p></p>

            </div>

        </div>


        <!-- Instagram -->
        <div class="socials">

            <a
                href="https://www.instagram.com/amanmessiii/"
                target="_blank"
                title="Instagram"
            >
                <i class="fa-brands fa-instagram"></i>
            </a>

        </div>


        <!-- Views -->
        <div class="views">

            <i class="fa-solid fa-eye"></i>

            <span>viewer count</span>

        </div>

    </main>


    <!-- Music -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>


    <!-- Speaker Button -->
    <button id="music-toggle" class="music-toggle">

        <i class="fa-solid fa-volume-high"></i>

    </button>


    <script src="script.js"></script>

</body>

</html>
