<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>@wxrper</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        html, body, * {
            cursor: url("https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/72x72/26bd.png") 16 16, auto !important;
        }

        #enter-screen {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(8px);
            z-index: 999999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        #enter-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .enter-content {
            text-align: center;
            color: white;
        }

        .enter-content h2 {
            margin: 0;
            font-size: 34px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .enter-content p {
            margin-top: 10px;
            font-size: 14px;
            color: rgba(255,255,255,0.6);
            animation: enterPulse 2s ease-in-out infinite;
        }

        @keyframes enterPulse {
            0%, 100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        #music-toggle {
            position: fixed;
            left: 25px;
            top: 25px;
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 140, 0, 0.35);
            border-radius: 50%;
            background: rgba(255, 140, 0, 0.12);
            backdrop-filter: blur(15px);
            color: #ff8c00;
            font-size: 18px;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: 0.25s;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.15);
        }

        #music-toggle.show {
            opacity: 1;
            pointer-events: auto;
        }

        #music-toggle:hover {
            transform: scale(1.1);
            background: rgba(255, 140, 0, 0.22);
            box-shadow: 0 0 25px rgba(255, 140, 0, 0.35);
        }

        .views {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>

<body>

    <!-- ENTER SCREEN -->
    <div id="enter-screen">
        <div class="enter-content">
            <h2>wxrperz</h2>
            <p>click to enter</p>
        </div>
    </div>

    <!-- BACKGROUND -->
    <div class="background"></div>

    <!-- PROFILE -->
    <main class="profile">

        <div class="avatar">
            <img src="pfp.jpg" alt="wxrperz">
        </div>

        <h1>wxrperz</h1>

        <p class="bio">follow up!</p>

        <p class="location">
            <i class="fa-solid fa-location-dot"></i>
            in your heart
        </p>

        <!-- USER BOX -->
        <div class="user-box">

            <img src="profile.jpg" alt="amanmessi">

            <div class="user-info">
                <strong>amanmessi</strong>
                <p>💖</p>
                <p></p>
            </div>

        </div>

        <!-- SOCIALS -->
        <div class="socials">

            <a
                href="https://www.instagram.com/amanmessiii/"
                target="_blank"
                title="Instagram"
            >
                <i class="fa-brands fa-instagram"></i>
            </a>

        </div>

        <!-- VIEW COUNT -->
        <div class="views">
            <i class="fa-solid fa-eye"></i>
            <span id="view-count">123 views</span>
        </div>

    </main>

    <!-- MUSIC -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- MUSIC BUTTON -->
    <button id="music-toggle">
        <i class="fa-solid fa-volume-high"></i>
    </button>


    <script>

        /* TAB TITLE ANIMATION */

        const title = "@wxrper";

        let visible = title.length;
        let fadingOut = true;

        setInterval(() => {

            if (fadingOut) {

                visible--;

                if (visible < 1) {
                    visible = 1;
                    fadingOut = false;
                }

                document.title = title.slice(0, visible);

            } else {

                visible++;

                document.title = title.slice(0, visible);

                if (visible === title.length) {
                    fadingOut = true;
                }

            }

        }, 300);


        /* ENTER + MUSIC */

        const enterScreen =
            document.getElementById("enter-screen");

        const music =
            document.getElementById("bg-music");

        const musicToggle =
            document.getElementById("music-toggle");


        enterScreen.addEventListener("click", () => {

            enterScreen.classList.add("hidden");

            music.volume = 0.5;

            music.play();

            musicToggle.classList.add("show");

        });


        /* MUTE / UNMUTE */

        musicToggle.addEventListener("click", () => {

            music.muted = !music.muted;

            if (music.muted) {

                musicToggle.innerHTML =
                    '<i class="fa-solid fa-volume-xmark"></i>';

            } else {

                musicToggle.innerHTML =
                    '<i class="fa-solid fa-volume-high"></i>';

            }

        });

    </script>

</body>
</html>
